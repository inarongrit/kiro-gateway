# Release: on a version tag (v1.2.3) build multi-arch images, push them to GitHub Container
# Registry with SBOM + provenance attestations, and scan what was pushed.
#   ghcr.io/<owner>/kiro-gateway-console:<version>   (console API + portal)
#   ghcr.io/<owner>/kiro-gateway-ml-guard:<version>  (Bedrock Guardrails layer)
# Deployments then set KGW_CONSOLE_IMAGE / KGW_ML_GUARD_IMAGE and run `docker compose pull`.
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write        # push to ghcr.io/<owner>
      id-token: write        # keyless provenance attestation
      attestations: write
    strategy:
      matrix:
        include:
          - name: console
            context: .
            dockerfile: console/Dockerfile
          - name: ml-guard
            context: ml-guard
            dockerfile: ml-guard/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/kiro-gateway-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: scan the pushed image (fail on fixable HIGH/CRITICAL)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/kiro-gateway-${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: >-
          docker run --rm aquasec/trivy:0.75.0 image --quiet --scanners vuln
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"
