# CI: lint, secret scan, portal checks, image build + vulnerability scan, and a full-stack smoke
# test (init -> compose up -> apply -> console API tests). Third-party actions are pinned by commit
# SHA; tool images by version. Runs on every push and pull request.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: >-
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 -S warning
          scripts/*.sh scripts/kiro-via-gateway console/tests/api_test.sh docs/evaluation/eval_layered.sh
      - name: ruff (Python, incl. security rules)
        run: docker run --rm -v "$PWD:/io" -w /io ghcr.io/astral-sh/ruff:0.16.10 check console/app ml-guard monitoring
      - name: hadolint (Dockerfiles)
        run: |
          for f in console/Dockerfile ml-guard/Dockerfile; do
            docker run --rm -i hadolint/hadolint:v2.15.1 hadolint --failure-threshold warning - < "$f"
          done
      - name: actionlint (workflows)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: compose file
        run: cp .env.example .env && docker compose config --quiet

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # scan the whole history, not just the tip
      - name: gitleaks (default rules + public IPs + AWS account ids)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --no-banner

  portal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: apply patches onto the pinned upstream dashboard
        run: scripts/dashboard.sh prepare
      - name: lint + type check + unit tests
        run: scripts/dashboard.sh check
      - name: production dependency audit
        run: scripts/dashboard.sh run audit --prod --audit-level high

  images-and-smoke:
    runs-on: ubuntu-24.04
    needs: [lint, secrets]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build images
        run: docker compose build console ml-guard
      - name: vulnerability scan (fail on fixable HIGH/CRITICAL)
        run: |
          for img in kiro-gateway-console:local kiro-gateway-ml-guard:local; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0 image \
              --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$img"
          done
      - name: first-run setup
        run: scripts/init.sh
      - name: start the stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: apply gateway config
        run: scripts/apply.sh
      - name: console API tests (sign-in, rules editor, live block on the Kiro path, observability API)
        run: console/tests/api_test.sh
      - name: logs on failure
        if: failure()
        run: docker compose ps && docker compose logs --tail 80
