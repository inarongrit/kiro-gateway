<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiro Gateway · sign in</title>
<link rel="icon" type="image/svg+xml" href="/static/kiro.svg">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<!-- Sign-in page for the portal (/ui/) and Grafana (/grafana/); they redirect here with ?next=. -->
<main id="login" class="login">
  <div class="card stack">
    <h1 class="brand"><img src="/static/kiro.svg" alt="" width="28" height="28">Kiro Gateway</h1>
    <div class="mu">Sign in to manage what Kiro and the AI gateway are allowed to send.</div>
    <form id="loginForm" class="stack">
      <label class="f">Username<input class="in" name="username" autocomplete="username" required></label>
      <label class="f">Password<input class="in" name="password" type="password" autocomplete="current-password" required></label>
      <div id="loginErr" class="err" role="alert"></div>
      <button class="btn p" type="submit">Sign in</button>
    </form>
  </div>
</main>
</body>
</html>
