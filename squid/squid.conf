# Squid = thin CONNECT tier. No TLS bumping here: APISIX terminates TLS.
# Interception is selected by DNS inside Squid only: hostnames listed in /etc/squid/gw-hosts
# resolve to APISIX (172.30.0.10); everything else resolves publicly and tunnels straight out.
http_port 3128

# Resolve intercepted hosts to APISIX first (empty file = pure tunnel). Everything else uses the
# resolver Docker hands the container (on AWS: the VPC resolver), so egress DNS policy applies.
hosts_file /etc/squid/gw-hosts

# Host-local clients arrive from the bridge (172.30.0.0/24) or loopback; remote client networks
# (laptops, VPN, VPC) come from allowed-clients.txt, written by scripts/init.sh.
acl clients src 172.30.0.0/24 127.0.0.0/8
acl clients src "/etc/squid/allowed-clients.txt"
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow clients
http_access deny all

# Pure forwarder: no caching, no header leakage of client identity.
cache deny all
via off
forwarded_for delete

# Log destination host (CONNECT target / URL), status, bytes. %ru is host:port for CONNECT.
logformat gw %{%Y-%m-%dT%H:%M:%S}tl %>a %rm %ru %>Hs %<st %tr %<a
access_log stdio:/var/log/squid/access.log gw
cache_log stdio:/var/log/squid/cache.log

shutdown_lifetime 1 seconds
