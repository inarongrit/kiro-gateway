# gitleaks config: the default ruleset plus checks for environment-specific values that must
# never be published, and an allow list for the deliberately fake secrets used as test fixtures.
# Run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml
[extend]
useDefault = true

[[rules]]
id = "aws-account-id-in-arn"
description = "AWS account id inside an ARN"
regex = '''arn:aws[a-z-]*:[a-z0-9-]+:[a-z0-9-]*:(\d{12}):'''
secretGroup = 1

[[rules]]
id = "public-ipv4"
description = "Public IPv4 address (deployment-specific; use a setting instead)"
regex = '''\b((?:[1-9]\d?|1\d\d|2[01]\d|22[0-3])\.(?:\d{1,3}\.){2}\d{1,3})\b'''
secretGroup = 1
  [rules.allowlist]
  # private, loopback, documentation and well-known public resolver/test ranges
  regexes = ['''^(10\.|127\.|172\.(1[6-9]|2\d|3[01])\.|192\.168\.|169\.254\.|192\.0\.2\.|198\.51\.100\.|203\.0\.113\.|0\.0\.0\.0)''']

[allowlist]
description = "Fake credentials used as guardrail test fixtures (AWS docs example keys, test strings)"
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',
  '''AKIAABCDEFGHIJKLMNOP''',
  '''ＡＫＩＡＡＢＣＤＥＦＧＨＩＪＫＬＭＮＯＰ''',
]
